<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Impuestos a las Actividades Economicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container-fluid p-3">

        <ul class="nav nav-tabs mb-3" id="mainTabs">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabClientes">Clientes</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabPeriodos">Periodos</button>
            </li>
        </ul>

        <div class="tab-content">

            <!-- ==================== CLIENTES ==================== -->
            <div class="tab-pane fade show active" id="tabClientes">
                <div class="row">
                    <div class="col-6">
                        <form id="frmCliente">
                            <input pattern="^[0-9]{3,10}$" required placeholder="Codigo" id="txtCodigoCliente"
                                class="form-control mb-2" type="text">
                            <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Nombre"
                                id="txtNombreCliente" class="form-control mb-2" type="text">
                            <input placeholder="Direccion" id="txtDireccionCliente" class="form-control mb-2"
                                type="text">
                            <input pattern="^[0-9]{4}-[0-9]{4}$" placeholder="Telefono" id="txtTelefonoCliente"
                                class="form-control mb-2" type="text">
                            <input placeholder="Email" id="txtEmailCliente" class="form-control mb-2" type="email">
                            <select class="form-control mb-2" id="cboTipoPersona">
                                <option value="particular">Particular</option>
                                <option value="empresa">Empresa</option>
                            </select>
                            <input type="submit" value="Guardar" class="btn btn-primary">
                            <input type="reset" value="Limpiar" class="btn btn-warning">
                        </form>
                    </div>
                    <div class="col-6">
                        <h5 class="text-center">BUSQUEDA DE CLIENTES</h5>
                        <input type="search" placeholder="buscar por codigo, nombre" id="txtBuscarCliente"
                            class="form-control mb-2">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Codigo</th>
                                        <th>Nombre</th>
                                        <th>Direccion</th>
                                        <th>Telefono</th>
                                        <th>Email</th>
                                        <th>Tipo</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="tblClientes"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ==================== PERIODOS ==================== -->
            <div class="tab-pane fade" id="tabPeriodos">
                <div class="row">
                    <div class="col-6">
                        <form id="frmPeriodo">
                            <label class="form-label">Cliente empresa</label>
                            <select class="form-control mb-2" id="cboCliente"></select>

                            <label class="form-label">Producto</label>
                            <select class="form-control mb-2" id="cboProducto">
                                <option value="1">11801 - Comercio</option>
                                <option value="2">11802 - Industria</option>
                            </select>

                            <label class="form-label">Desde</label>
                            <input type="date" id="txtDesde" class="form-control mb-2" required>

                            <label class="form-label">Hasta</label>
                            <input type="date" id="txtHasta" class="form-control mb-2" required>

                            <label class="form-label">Balance o activo</label>
                            <input type="number" step="0.01" id="txtBalance" class="form-control mb-2"
                                placeholder="Balance anual" required>

                            <div id="detalleCalculo" class="alert alert-info py-2"></div>

                            <input type="submit" value="Guardar periodo" class="btn btn-primary">
                            <input type="reset" value="Limpiar" class="btn btn-warning">
                        </form>
                    </div>
                    <div class="col-6">
                        <h5 class="text-center">PERIODOS REGISTRADOS</h5>
                        <input type="search" placeholder="buscar por cliente" id="txtBuscarPeriodo"
                            class="form-control mb-2">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Cliente</th>
                                        <th>Desde</th>
                                        <th>Hasta</th>
                                        <th>Balance</th>
                                        <th>Precio</th>
                                        <th>Estado</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="tblPeriodos"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /* ==================== CLIENTES ==================== */
        let accionCli = 'nuevo', idCliente = '';

        frmCliente.addEventListener('submit', e => { e.preventDefault(); guardarCliente(); });
        frmCliente.addEventListener('reset', e => { e.preventDefault(); limpiarFormularioCliente(); });
        txtBuscarCliente.addEventListener('keyup', () => obtenerClientes(txtBuscarCliente.value));

        async function obtenerClientes(buscar = "") {
            let r = await fetch(`/clientes?buscar=${buscar}`);
            let datos = await r.json();
            mostrarClientes(datos);
            llenarComboClientes(datos);
        }
        function mostrarClientes(datos) {
            let filas = "";
            datos.forEach(e => {
                filas += `
            <tr onclick='modificarCliente(${JSON.stringify(e)}, event)'>
                <td>${e.codigo}</td>
                <td>${e.nombre}</td>
                <td>${e.direccion ?? ''}</td>
                <td>${e.telefono ?? ''}</td>
                <td>${e.email ?? ''}</td>
                <td>${e.tipo}</td>
                <td><button class="btn btn-danger btn-sm"
                    onclick='eliminarCliente(${JSON.stringify(e)}, event)'>DEL</button></td>
            </tr>`;
            });
            tblClientes.innerHTML = filas;
        }
        function llenarComboClientes(datos) {
            let opciones = "";
            datos.filter(c => c.tipo === 'empresa').forEach(c => {
                opciones += `<option value="${c.idCliente}">${c.codigo} - ${c.nombre}</option>`;
            });
            cboCliente.innerHTML = opciones || '<option value="">(sin clientes empresa)</option>';
        }
        function modificarCliente(data, event) {
            event.preventDefault();
            idCliente = data.idCliente;
            accionCli = "modificar";
            txtCodigoCliente.value = data.codigo;
            txtNombreCliente.value = data.nombre;
            txtDireccionCliente.value = data.direccion ?? '';
            txtTelefonoCliente.value = data.telefono ?? '';
            txtEmailCliente.value = data.email ?? '';
            cboTipoPersona.value = data.tipo;
        }
        function eliminarCliente(data, event) {
            event.preventDefault();
            event.stopPropagation();
            if (confirm(`¿Eliminar al cliente ${data.nombre}?`)) {
                idCliente = data.idCliente;
                accionCli = "eliminar";
                guardarCliente();
            }
        }
        async function guardarCliente() {
            let datos = {
                codigo: txtCodigoCliente.value,
                nombre: txtNombreCliente.value,
                direccion: txtDireccionCliente.value,
                telefono: txtTelefonoCliente.value,
                email: txtEmailCliente.value,
                tipo: cboTipoPersona.value,
                accion: accionCli,
                idCliente
            };
            let r = await fetch('/cliente', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            let j = await r.json();
            if (j.msg !== "ok") { alert("Error: " + j.msg); return; }
            obtenerClientes();
            limpiarFormularioCliente();
        }
        function limpiarFormularioCliente() {
            accionCli = 'nuevo';
            idCliente = '';
            txtCodigoCliente.value = '';
            txtNombreCliente.value = '';
            txtDireccionCliente.value = '';
            txtTelefonoCliente.value = '';
            txtEmailCliente.value = '';
            cboTipoPersona.value = 'particular';
        }

        /* ==================== PERIODOS ==================== */
        let accionPer = 'nuevo', idPeriodo = '';

        frmPeriodo.addEventListener('submit', e => { e.preventDefault(); guardarPeriodo(); });
        frmPeriodo.addEventListener('reset', e => { e.preventDefault(); limpiarFormularioPeriodo(); });
        txtBalance.addEventListener('keyup', recalcularPeriodo);
        cboCliente.addEventListener('change', recalcularPeriodo);
        cboProducto.addEventListener('change', recalcularPeriodo);
        txtDesde.addEventListener('change', recalcularPeriodo);
        txtBuscarPeriodo.addEventListener('keyup', () => obtenerPeriodos(txtBuscarPeriodo.value));

        async function obtenerPeriodos(buscar = "") {
            let r = await fetch(`/periodos?buscar=${buscar}`);
            let datos = await r.json();
            let filas = "";
            datos.forEach(p => {
                filas += `
            <tr>
                <td>${p.nombreCliente}</td>
                <td>${p.desde}</td>
                <td>${p.hasta}</td>
                <td>${p.balance}</td>
                <td>${p.precio}</td>
                <td>${p.estado}</td>
                <td><button class="btn btn-danger btn-sm"
                    onclick='eliminarPeriodo(${p.idPeriodo})'>DEL</button></td>
            </tr>`;
            });
            tblPeriodos.innerHTML = filas;
        }
        async function recalcularPeriodo() {
            if (!cboCliente.value || !txtBalance.value || !txtDesde.value) return;
            let datos = {
                accion: 'calcular',
                idCliente: cboCliente.value,
                idProducto: cboProducto.value,
                balance: txtBalance.value,
                desde: txtDesde.value
            };
            let r = await fetch('/periodo/calcular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            let j = await r.json();
            if (j.msg !== "ok") {
                detalleCalculo.className = "alert alert-danger py-2";
                detalleCalculo.innerHTML = j.msg;
                return;
            }
            detalleCalculo.className = "alert alert-info py-2";
            detalleCalculo.innerHTML =
                `Rango: ${j.tarifa.desde} – ${j.tarifa.hasta}<br>
         Base: ${j.tarifa.precioBase} | Adicional: ${j.tarifa.adicional} | %: ${j.tarifa.porcentaje}<br>
         Formula (${j.formula}): ${j.detalle}<br>
         <b>Impuesto mensual: $${j.precio}</b>`;
        }
        async function guardarPeriodo() {
            let datos = {
                accion: accionPer,
                idPeriodo,
                idCliente: cboCliente.value,
                idProducto: cboProducto.value,
                desde: txtDesde.value,
                hasta: txtHasta.value,
                balance: txtBalance.value
            };
            let r = await fetch('/periodo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            let j = await r.json();
            if (j.msg !== "ok") { alert("Error: " + j.msg); return; }
            obtenerPeriodos();
            limpiarFormularioPeriodo();
        }
        async function eliminarPeriodo(id) {
            if (!confirm("¿Eliminar este periodo?")) return;
            let r = await fetch('/periodo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accion: 'eliminar', idPeriodo: id })
            });
            let j = await r.json();
            if (j.msg !== "ok") { alert("Error: " + j.msg); return; }
            obtenerPeriodos();
        }
        function limpiarFormularioPeriodo() {
            accionPer = 'nuevo';
            idPeriodo = '';
            txtDesde.value = '';
            txtHasta.value = '';
            txtBalance.value = '';
            detalleCalculo.innerHTML = '';
            detalleCalculo.className = 'alert alert-info py-2';
        }

        /* ==================== INIT ==================== */
        document.addEventListener("DOMContentLoaded", () => {
            obtenerClientes();
            obtenerPeriodos();
        });
    </script>
</body>

</html>
