<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades económicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <nav class="navbar bg-body-tertiary mb-3">
        <div class="container-fluid">
            <span class="navbar-brand">Impuestos</span>
            <div><a class="btn btn-link" href="/index.html">Clientes</a><a class="btn btn-link"
                    href="/periodos.html">Períodos</a></div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-5">
                <form id="frmCliente" class="vstack gap-2">
                    <input pattern="^[0-9]{3,10}$" required placeholder="Código" id="txtCodigoCliente"
                        class="form-control">
                    <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Nombre" id="txtNombreCliente"
                        class="form-control">
                    <input placeholder="Dirección" id="txtDireccionCliente" class="form-control">
                    <input pattern="^[0-9]{4}-[0-9]{4}$" placeholder="Teléfono (0000-0000)" id="txtTelefonoCliente"
                        class="form-control">
                    <input type="email" placeholder="Email" id="txtEmailCliente" class="form-control">
                    <select class="form-select" id="cboTipoPersona">
                        <option value="particular">Particular</option>
                        <option value="empresa">Empresa</option>
                    </select>
                    <div><button class="btn btn-primary">Guardar</button>
                        <button type="reset" class="btn btn-warning">Limpiar</button>
                    </div>
                </form>
            </div>
            <div class="col-md-7">
                <input type="search" placeholder="Buscar por código o nombre" id="txtBuscarCliente"
                    class="form-control mb-2">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Dirección</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Tipo</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tblClientes"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script>
        let accion = 'nuevo', idCliente = '';
        const $ = id => document.getElementById(id);

        $('frmCliente').addEventListener('submit', e => { e.preventDefault(); guardarClientes(); });
        $('frmCliente').addEventListener('reset', e => { e.preventDefault(); limpiarFormulario(); });
        $('txtBuscarCliente').addEventListener('keyup', () => obtenerClientes($('txtBuscarCliente').value));
        document.addEventListener('DOMContentLoaded', () => obtenerClientes());

        async function obtenerClientes(buscar = '') {
            const r = await fetch(`/clientes?buscar=${encodeURIComponent(buscar)}`);
            mostrarDatos(await r.json());
        }
        function mostrarDatos(datos) {
            const tbody = $('tblClientes');
            tbody.replaceChildren();
            datos.forEach(c => {           // textContent evita inyección de HTML (XSS)
                const tr = document.createElement('tr');
                ['codigo', 'nombre', 'direccion', 'telefono', 'email', 'tipo'].forEach(k => {
                    const td = document.createElement('td'); td.textContent = c[k]; tr.appendChild(td);
                });
                const td = document.createElement('td');
                const del = document.createElement('button');
                del.className = 'btn btn-danger btn-sm'; del.textContent = 'Eliminar';
                del.addEventListener('click', ev => { ev.stopPropagation(); eliminarCliente(c); });
                td.appendChild(del); tr.appendChild(td);
                tr.addEventListener('click', () => modificarCliente(c));
                tbody.appendChild(tr);
            });
        }
        function modificarCliente(c) {
            idCliente = c.idCliente; accion = 'modificar';
            $('txtCodigoCliente').value = c.codigo; $('txtNombreCliente').value = c.nombre;
            $('txtDireccionCliente').value = c.direccion; $('txtTelefonoCliente').value = c.telefono;
            $('txtEmailCliente').value = c.email; $('cboTipoPersona').value = c.tipo;
        }
        function eliminarCliente(c) {
            if (confirm(`¿Eliminar al cliente ${c.nombre}?`)) { idCliente = c.idCliente; accion = 'eliminar'; guardarClientes(); }
        }
        async function guardarClientes() {
            const datos = {
                codigo: $('txtCodigoCliente').value, nombre: $('txtNombreCliente').value,
                direccion: $('txtDireccionCliente').value, telefono: $('txtTelefonoCliente').value,
                email: $('txtEmailCliente').value, tipo: $('cboTipoPersona').value, accion, idCliente
            };
            const r = await fetch('/cliente', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
            const res = await r.json();
            if (res.msg !== 'ok') { alert(res.msg); return; }
            obtenerClientes(); limpiarFormulario();
        }
        function limpiarFormulario() {
            accion = 'nuevo'; idCliente = '';
            ['Codigo', 'Nombre', 'Direccion', 'Telefono', 'Email'].forEach(k => $('txt' + k + 'Cliente').value = '');
            $('cboTipoPersona').value = 'particular';
        }
    </script>
</body>

</html>
