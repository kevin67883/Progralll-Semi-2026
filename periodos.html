<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Períodos de balance</title>
    <style>
        :root {
            color-scheme: light;
            --field: #e9edf0;
            --bg: #f2f4f6;
            --card: #fff;
            --ink: #1b2733;
            --mute: #5d6b78;
            --line: #d5dce2;
            --acc: #0f5c6e;
            --err: #b3261e;
            --ok: #1f7a4d
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px system-ui, sans-serif
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px;
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr 1fr
        }

        nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 16px
        }

        nav a {
            color: var(--acc);
            margin-right: 12px
        }

        section {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .04)
        }

        .ancho {
            grid-column: 1/-1
        }

        h2 {
            margin: 0 0 12px;
            font-size: 17px
        }

        label {
            display: block;
            color: var(--mute);
            font-size: 13px;
            margin-top: 10px
        }

        input,
        select {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--field);
            color: var(--ink);
            font: inherit
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        button {
            margin-top: 12px;
            padding: 9px 16px;
            border: 0;
            border-radius: 6px;
            background: var(--acc);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        summary {
            cursor: pointer;
            color: var(--acc);
            margin-top: 10px
        }

        dl {
            margin: 0;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px 12px
        }

        dd {
            margin: 0;
            text-align: right
        }

        dt {
            color: var(--mute)
        }

        .precio {
            font-size: 32px;
            font-weight: 700;
            color: var(--acc);
            margin-top: 12px
        }

        .precio small {
            font-size: 14px;
            font-weight: 400;
            color: var(--mute)
        }

        #msg {
            margin-top: 10px;
            font-weight: 600
        }

        .err {
            color: var(--err)
        }

        .ok {
            color: var(--ok)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--line)
        }

        .tabla {
            overflow-x: auto
        }

        @media(max-width:800px) {
            main {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <nav><a href="/index.html">Clientes</a><a href="/periodos.html">Períodos</a></nav>
    <main>
        <section>
            <h2>Nuevo período</h2>
            <label for="cboCliente">Empresa</label>
            <select id="cboCliente"></select>
            <details open>
                <summary>Registrar una empresa</summary>
                <div class="fila">
                    <div><label for="txtCodigo">Código</label><input id="txtCodigo" placeholder="C002"></div>
                    <div><label for="txtNombre">Nombre</label><input id="txtNombre" placeholder="Empresa S.A."></div>
                </div>
                <button type="button" id="btnEmpresa">Guardar empresa</button>
            </details>
            <label for="cboProducto">Producto</label>
            <select id="cboProducto"></select>
            <div class="fila">
                <div><label for="txtDesde">Desde (incluido)</label><input type="date" id="txtDesde"></div>
                <div><label for="txtHasta">Hasta (no incluido)</label><input type="date" id="txtHasta"></div>
            </div>
            <label for="txtBalance">Balance o activo declarado ($)</label>
            <input type="number" step="0.01" min="0.01" id="txtBalance">
            <button type="button" id="btnGuardar">Guardar período</button>
            <div id="msg" role="status"></div>
        </section>
        <section>
            <h2>Cálculo del impuesto</h2>
            <div id="calculo">
                <p style="color:var(--mute)">Ingrese el balance para ver el cálculo.</p>
            </div>
        </section>
        <section class="ancho">
            <h2>Períodos registrados</h2>
            <div class="tabla">
                <table>
                    <thead>
                        <tr>
                            <th>Empresa</th>
                            <th>Producto</th>
                            <th>Desde</th>
                            <th>Hasta</th>
                            <th>Balance</th>
                            <th>Precio mensual</th>
                            <th>Fórmula</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tblPeriodos"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        const $ = id => document.getElementById(id);
        const usd = v => '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        let temporizador;

        function mensaje(texto, ok) { $('msg').textContent = texto; $('msg').className = ok ? 'ok' : 'err'; }

        async function cargarEmpresas(seleccionar) {
            const lista = (await (await fetch('/clientes?buscar=')).json()).filter(c => c.tipo === 'empresa');
            $('cboCliente').replaceChildren();
            lista.forEach(c => $('cboCliente').add(new Option(`${c.codigo} · ${c.nombre}`, c.idCliente)));
            if (seleccionar) $('cboCliente').value = seleccionar;
        }
        async function cargarProductos() {
            const r = await fetch('/productos');
            const lista = await r.json();
            if (!Array.isArray(lista)) throw new Error(lista.msg || 'No se pudieron cargar los productos');
            $('cboProducto').replaceChildren(new Option('Seleccione el producto...', ''));
            lista.forEach(p => $('cboProducto').add(new Option(`${p.idProducto} · ${p.nombre.replace('Impuesto a las Actividades Económicas ', '')}`, p.idProducto)));
        }
        async function cargarPeriodos() {
            const tbody = $('tblPeriodos'); tbody.replaceChildren();
            const filas = await (await fetch('/periodos')).json();
            filas.forEach(p => {
                const tr = document.createElement('tr');
                [p.nombreCliente, p.idProducto, p.desde, p.hasta, usd(p.balance), usd(p.precio), `${p.formula}: ${p.detalleCalculo}`, p.estado]
                    .forEach(t => { const td = document.createElement('td'); td.textContent = t; tr.appendChild(td); });
                tbody.appendChild(tr);
            });
        }
        function vistaPrevia() {
            clearTimeout(temporizador);
            temporizador = setTimeout(async () => {
                const box = $('calculo');
                if (!$('txtBalance').value) { box.textContent = 'Ingrese el balance para ver el cálculo.'; return; }
                const q = new URLSearchParams({ idProducto: $('cboProducto').value, balance: $('txtBalance').value, desde: $('txtDesde').value });
                const r = await (await fetch('/calcular?' + q)).json();
                box.replaceChildren();
                if (r.msg !== 'ok') { const p = document.createElement('p'); p.className = 'err'; p.textContent = r.msg; box.appendChild(p); return; }
                const d = r.detalle, dl = document.createElement('dl');
                [['Balance', usd(d.balance)], ['Rango aplicado', d.rango.split(' a ').map(usd).join(' a ')], ['Precio base', usd(d.precioBase)],
                ['Adicional por bloque', usd(d.adicional)], ['Porcentaje', Number(d.porcentaje)], [`Fórmula (${d.formula})`, d.detalleCalculo]]
                    .forEach(([k, v]) => { const a = document.createElement('dt'), b = document.createElement('dd'); a.textContent = k; b.textContent = v; dl.append(a, b); });
                const precio = document.createElement('div');
                precio.className = 'precio'; precio.append(usd(d.precioMostrado) + ' ');
                const por = document.createElement('small'); por.textContent = 'por mes'; precio.appendChild(por);
                box.append(dl, precio);
            }, 250);
        }
        async function enviar(url, datos) {
            const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
            return (await r.json()).msg;
        }
        $('btnGuardar').addEventListener('click', async () => {
            const msg = await enviar('/periodo', {
                idCliente: $('cboCliente').value, idProducto: $('cboProducto').value,
                desde: $('txtDesde').value, hasta: $('txtHasta').value, balance: $('txtBalance').value
            });
            if (msg === 'ok') { mensaje('Período guardado.', true); cargarPeriodos(); } else mensaje(msg, false);
        });
        $('btnEmpresa').addEventListener('click', async () => {
            const msg = await enviar('/cliente', {
                accion: 'nuevo', codigo: $('txtCodigo').value, nombre: $('txtNombre').value,
                direccion: '', telefono: '', email: '', tipo: 'empresa', idCliente: ''
            });
            if (msg !== 'ok') { mensaje(msg, false); return; }
            mensaje('Empresa registrada.', true);
            $('txtCodigo').value = $('txtNombre').value = '';
            await cargarEmpresas();
            $('cboCliente').selectedIndex = $('cboCliente').options.length - 1;
        });
        ['txtBalance', 'txtDesde'].forEach(id => $(id).addEventListener('input', vistaPrevia));
        $('cboProducto').addEventListener('change', vistaPrevia);
        (async () => {
            try { await cargarEmpresas(); await cargarProductos(); await cargarPeriodos(); }
            catch (e) { mensaje('No se pudo cargar la información: ' + e.message, false); }
        })();
    </script>
</body>

</html>
